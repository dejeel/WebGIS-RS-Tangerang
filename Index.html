<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebGIS Rumah Sakit Kota Tangerang</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A2647;--navy2:#123A6B;--blue:#1D5FA8;--sky:#E6F0FB;--bg:#F3F7FC;--line:#D8E3F0;--muted:#5F7590;--ink:#14263D;--red:#E31A1C;--amber:#E0A21A;--w:392px;--gb:linear-gradient(135deg,#1D5FA8,#3B8BE0);--gs:linear-gradient(160deg,#F2F8FF,#DCEAFA);--sh:0 6px 20px rgba(10,38,71,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:500 13px Manrope,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
#map{position:fixed;top:0;bottom:0;right:0;left:var(--w)}
button{font:inherit;cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Sidebar */
.side{position:fixed;z-index:1000;top:0;bottom:0;left:0;width:var(--w);display:flex;flex-direction:column;background:#fff;box-shadow:4px 0 24px rgba(10,38,71,.16)}
.top{position:relative;padding:22px 20px 20px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,rgba(80,150,230,.55),transparent 60%),linear-gradient(145deg,#0A2647 0%,#123A6B 55%,#1B5BA3 100%)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#1D5FA8,#5AA6F0,#9CCBFA)}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:44px;height:44px;border-radius:13px;background:#fff;color:var(--blue);display:grid;place-items:center}
.logo i svg{width:24px;height:24px;stroke-width:3.2}
.logo b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.logo span{display:block;margin-top:4px;font-size:12.5px;color:#B9CFEA}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2)}
.kpi{padding:0 12px;border-left:1px solid rgba(255,255,255,.2)}
.kpi:first-child{padding-left:0;border-left:0}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.kpi span{display:block;margin-top:3px;font-size:11px;color:#B9CFEA}
.tabs{display:flex;gap:4px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px;border:0;background:none;color:var(--muted);font-weight:700;border-bottom:3px solid transparent}
[data-view=list] [data-tab=list],[data-view=stats] [data-tab=stats]{color:var(--blue);border-bottom-color:#3B8BE0;background:linear-gradient(180deg,transparent,#E6F0FB)}
[data-view=detail] .tabs{display:none}
.body{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;background:linear-gradient(180deg,#fff 0,#F4F8FD 100%)}
.v{display:none}
[data-view=list] #vList,[data-view=stats] #vStats,[data-view=detail] #vDetail{display:block}
.foot{padding:12px 14px;border-top:1px solid var(--line);background:linear-gradient(180deg,#F4F8FD,#E8F1FB)}
.export{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;border:1px solid var(--blue);border-radius:11px;background:#fff;color:var(--blue);font-weight:700}
.export:hover{background:var(--gb);border-color:transparent;color:#fff}
.foot small{display:block;margin-top:8px;text-align:center;color:var(--muted);font-size:11px}

.lab{display:block;margin:0 0 6px;font-size:12px;font-weight:700;color:var(--muted)}
.field{position:relative;margin:0 0 12px}
.field svg{position:absolute;left:12px;top:12px;width:16px;height:16px;color:var(--muted)}
input[type=search],select{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;padding:0 12px}
input[type=search]{padding-left:36px}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,95,168,.15);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.count{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--muted);font-weight:700}
.count button{border:0;background:none;color:var(--blue);font-weight:700}
.item{display:flex;align-items:center;gap:11px;padding:10px;margin-bottom:8px;border:1px solid var(--line);border-radius:13px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--blue);background:linear-gradient(90deg,#fff,#EDF4FD);box-shadow:0 4px 12px rgba(29,95,168,.14)}
.ico{width:38px;height:38px;border-radius:11px;background:var(--gs);color:var(--blue);display:grid;place-items:center;flex:none}
.ico svg{stroke-width:3}
.item div{min-width:0;flex:1}
.item b{display:block;font-size:14px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:block;margin-top:2px;color:var(--muted);font-size:12px}
.rate{font-weight:800;font-size:12px;color:#8A6414;white-space:nowrap}
.rate::before{content:"★ ";color:var(--amber)}
.rate.none{color:#9AAAC0}.rate.none::before{content:""}
.empty{padding:16px;text-align:center;color:var(--muted);background:var(--bg);border-radius:12px}

/* Statistik */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.card{background:var(--gs);border-radius:12px;padding:10px 8px}
.card b{display:block;font-size:16px;font-weight:800;color:var(--navy)}
.card span{font-size:11px;color:var(--muted)}
.bar{display:grid;grid-template-columns:104px 1fr 54px;align-items:center;gap:8px;width:100%;margin-bottom:6px;padding:5px 4px;border:0;border-radius:8px;background:none;text-align:left;color:var(--ink)}
.bar:hover{background:var(--sky)}
.bar span{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar em{height:10px;border-radius:99px;background:var(--sky);overflow:hidden}
.bar u{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#123A6B,#1D5FA8 55%,#5AA6F0)}
.bar b{font-size:12px;text-align:right}
.note{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}

/* Detail */
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;border:0;background:none;color:var(--blue);font-weight:700;padding:0}
.back svg{width:16px;height:16px}
.ph{width:100%;height:150px;object-fit:cover;border-radius:14px;display:block;background:var(--sky);margin-bottom:12px}
#vDetail h4{margin:0;font-size:19px;font-weight:800;color:var(--navy)}
.alias{margin:3px 0 8px;color:var(--muted)}
.stars{color:var(--amber);letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid div{background:var(--gs);border-radius:11px;padding:9px 4px;text-align:center}
.grid b{display:block;font-size:15px;color:var(--navy)}.grid span{font-size:10.5px;color:var(--muted)}
.irow{display:grid;grid-template-columns:100px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.irow span{color:var(--muted)}.irow b{font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts a{display:flex;justify-content:center;padding:11px;border-radius:11px;font-weight:700;text-decoration:none;background:var(--gs);color:var(--navy)}
.acts a:first-child{background:var(--gb);color:#fff}
.src{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5}

/* Alat peta (kiri) */
.sw{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:600;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw i{width:38px;height:22px;border-radius:99px;background:#BCC9DA;position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw input:checked+i{background:var(--gb)}
.sw input:checked+i::after{transform:translateX(16px)}
.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.layers{margin:2px 0 14px;padding-top:12px;border-top:1px solid var(--line)}
.tools{position:fixed;z-index:900;top:14px;left:calc(var(--w) + 14px);display:flex;flex-direction:column;gap:8px}
.tbtn{width:40px;height:40px;border:0;border-radius:12px;background:#fff;color:var(--navy);box-shadow:var(--sh);display:grid;place-items:center}
.tbtn{background:linear-gradient(180deg,#fff,#EEF5FD)}
.tbtn:hover,.tbtn.on{background:var(--gb);color:#fff}
.bm{position:fixed;z-index:901;top:14px;left:calc(var(--w) + 62px);width:190px;padding:8px;background:#fff;border-radius:14px;box-shadow:var(--sh);display:none}
.bm.open{display:block}
.bm p{margin:4px 6px 6px;font-weight:700;font-size:12px;color:var(--muted)}
.bm button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;color:var(--ink);font-weight:600}
.bm button:hover{background:var(--bg)}
.bm button.on{background:var(--gs);color:var(--blue);font-weight:700}
.leaflet-bar{border:0!important;border-radius:12px!important;box-shadow:var(--sh)!important;overflow:hidden}
.leaflet-bar a{color:var(--navy)!important;width:38px!important;height:38px!important;line-height:38px!important}
.leaflet-bottom.leaflet-right{margin-bottom:8px}
.coord{position:fixed;z-index:900;left:calc(var(--w) + 14px);bottom:36px;background:rgba(255,255,255,.94);padding:5px 12px;border-radius:99px;box-shadow:var(--sh);font-size:11px;color:var(--muted);pointer-events:none}

/* Marker & popup */
.tri{width:22px;height:28px;display:block;transform-origin:50% 95%;transition:transform .15s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.tri svg{width:22px;height:28px}
.tri.act{transform:scale(1.25);filter:drop-shadow(0 0 5px #0A2647)}
.popup h4{margin:0 0 6px;color:var(--navy);font-size:15px}
.popup table{font-size:12.5px;border-collapse:collapse}.popup td{padding:2px 8px 2px 0}.popup td:first-child{font-weight:700}

@media(max-width:820px){
 :root{--w:0px}
 .side{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:54dvh;border-radius:18px;overflow:hidden}
 .top{padding:12px 14px}.kpis{margin-top:10px;padding-top:10px}.kpi b{font-size:18px}.logo b{font-size:17px}
 .tools{left:10px;top:10px}.bm{left:58px;top:10px}
 .coord{display:none}
 .leaflet-bottom.leaflet-right{margin-bottom:56dvh}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<aside class="side" id="sidebar" data-view="list">
  <div class="top">
    <div class="logo"><div><b>Sebaran Rumah Sakit</b><span>Kota Tangerang, Provinsi Banten</span></div></div>
    <div class="kpis">
      <div class="kpi"><b id="statTotal">11</b><span>Rumah sakit</span></div>
      <div class="kpi"><b id="statRated">—</b><span>Rating ≥ 4</span></div>
      <div class="kpi"><b id="statAvg">—</b><span>Rata-rata rating</span></div>
    </div>
  </div>
  <div class="tabs"><button data-tab="list">Daftar</button><button data-tab="stats">Statistik</button></div>
  <div class="body">
    <section class="v" id="vList">
      <form class="field" id="searchForm"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" aria-label="Cari rumah sakit" placeholder="Cari nama rumah sakit..." autocomplete="off"></form>
      <div class="two">
        <div><label class="lab" for="ratingFilter">Rating</label><select id="ratingFilter"><option value="all">Semua rating</option><option value="4">Rating ≥ 4.0</option><option value="4.5">Rating ≥ 4.5</option></select></div>
        <div><label class="lab" for="sortHospital">Urutkan</label><select id="sortHospital"><option value="default">Urutan data</option><option value="rating">Rating tertinggi</option><option value="name">Nama A–Z</option></select></div>
      </div>
      <div class="layers"><span class="lab">Lapisan peta</span>
        <label class="sw"><input id="cbR" type="checkbox" checked><i></i>Rumah sakit</label>
        <label class="sw"><input id="cbJ" type="checkbox" checked><i></i>Jalan utama</label>
        <label class="sw"><input id="cbB" type="checkbox" checked><i></i>Batas kecamatan</label></div>
      <div class="count"><span id="countLabel"></span><button id="resetFilters" type="button">Reset filter</button></div>
      <div id="hospitalList"></div>
    </section>
    <section class="v" id="vStats">
      <div class="cards"><div class="card"><b id="sumPasien">—</b><span>Total pasien</span></div><div class="card"><b id="avgBor">—</b><span>Rata-rata BOR</span></div><div class="card"><b id="avgLos">—</b><span>Rata-rata LOS</span></div></div>
      <label class="lab" for="metric">Bandingkan rumah sakit berdasarkan</label>
      <select id="metric" style="margin-bottom:12px"><option value="bor">BOR (%)</option><option value="pasien">Jumlah pasien</option><option value="los">LOS (hari)</option><option value="ndr">NDR</option></select>
      <div id="bars"></div>
      <p class="note" id="metricNote"></p>
    </section>
    <section class="v" id="vDetail"><button class="back" id="backBtn" type="button"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>Kembali ke daftar</button><div id="detail"></div></section>
  </div>
  <div class="foot"><button class="export" id="exportBtn" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Ekspor data (GeoJSON)</button><small>Data: rumah sakit, jalan utama, batas kecamatan</small></div>
</aside>

<div class="tools">
  <button class="tbtn" id="bmBtn" title="Peta dasar" aria-label="Peta dasar"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg></button>
  <button class="tbtn" id="homeBtn" title="Tampilan awal" aria-label="Tampilan awal"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z"/></svg></button>
  <button class="tbtn" id="locateBtn" title="Lokasi saya" aria-label="Lokasi saya"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <button class="tbtn" id="fsBtn" title="Layar penuh" aria-label="Layar penuh"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/></svg></button>
</div>
<div class="bm" id="bm"><p>Peta dasar</p><button data-bm="googleRoad" class="on">Google Road</button><button data-bm="satellite">Satellite</button><button data-bm="terrain">Terrain</button><button data-bm="light">Light</button></div>
<div class="coord" id="coordStatus">Koordinat peta</div>

let tile=null;
function setBasemap(name){
  const c=basemaps[name]; if(!c) return;
  if(tile) map.removeLayer(tile);
  const t=L.tileLayer(c.u,{attribution:c.a,maxZoom:20,maxNativeZoom:19,keepBuffer:3});
  if(c.f){let used=false;t.on('tileerror',()=>{if(used||tile!==t)return;used=true;map.removeLayer(t);tile=L.tileLayer(c.f,{attribution:'&copy; Esri',maxZoom:20,maxNativeZoom:19}).addTo(map).bringToBack();});}
  tile=t.addTo(map).bringToBack();
  document.querySelectorAll('[data-bm]').forEach(b=>b.classList.toggle('on',b.dataset.bm===name));
}

function visible(){

  if(s==='rating')a.sort((x,y)=>(info(nm(y)).rating??-1)-(info(nm(x)).rating??-1));
  if(s==='name')a.sort((x,y)=>nm(x).localeCompare(nm(y),'id'));
  return a;
}
function buildList(){

  $('statAvg').textContent=rt.length?(rt.reduce((x,y)=>x+y,0)/rt.length).toFixed(1):'—';
  $('countLabel').textContent=a.length+' rumah sakit ditemukan';
  box.innerHTML='';
  if(!a.length){box.innerHTML='<div class="empty">Tidak ada rumah sakit yang sesuai. Ubah kata kunci atau reset filter.</div>';return;}
  a.forEach(f=>{
    const n=nm(f),i=info(n),el=document.createElement('div');
    el.className='item';el.tabIndex=0;
    el.innerHTML='<div class="ico">'+CROSS+'</div><div><b>'+esc(n)+'</b><small>'+esc(i.alias||'Fasilitas kesehatan')+'</small></div><span class="rate'+(i.rating==null?' none':'')+'">'+(i.rating==null?'—':i.rating.toFixed(1))+'</span>';

    box.appendChild(el);
  });
}

/* Statistik */
const metrics={bor:{k:'BOR (%)',u:'%',d:1,n:'Acuan umum BOR ideal: 60–85%.'},pasien:{k:'JML PASIEN',u:'',d:0,n:''},los:{k:'LOS',u:' hr',d:1,n:'LOS: rata-rata lama rawat (hari).'},ndr:{k:'NDR',u:'',d:2,n:'NDR: angka kematian ≥ 48 jam per 1.000 pasien keluar.'}};
function buildStats(){
  const fs=R.features,P=k=>fs.map(f=>+f.properties[k]).filter(v=>!isNaN(v)),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  $('sumPasien').textContent=num(P('JML PASIEN').reduce((x,y)=>x+y,0),0);
  $('avgBor').textContent=num(avg(P('BOR (%)')),1)+'%';
  $('avgLos').textContent=num(avg(P('LOS')),1)+' hr';
  const m=metrics[$('metric').value];
  const rows=fs.map(f=>({f,v:+f.properties[m.k]})).filter(r=>!isNaN(r.v)).sort((a,b)=>b.v-a.v),max=Math.max(...rows.map(r=>r.v))||1;
  $('bars').innerHTML=rows.map(r=>'<button class="bar"><span title="'+esc(nm(r.f))+'">'+esc(nm(r.f).replace(/\s+/g,' '))+'</span><em><u style="width:'+(r.v/max*100)+'%"></u></em><b>'+num(r.v,m.d)+m.u+'</b></button>').join('');
  $('bars').querySelectorAll('.bar').forEach((b,i)=>b.onclick=()=>pick(rows[i].f));
  $('metricNote').textContent=m.n;
}
buildList();buildStats();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>view(b.dataset.tab));
$('metric').onchange=buildStats;

/* Kontrol */
$('q').addEventListener('input',buildList);
$('ratingFilter').addEventListener('change',buildList);
$('sortHospital').addEventListener('change',buildList);
$('resetFilters').onclick=()=>{$('q').value='';$('ratingFilter').value='all';$('sortHospital').value='default';buildList();};
$('searchForm').onsubmit=e=>{e.preventDefault();const m=visible()[0];if(m)pick(m);};
const toggle=(id,layer)=>$(id).addEventListener('change',e=>e.target.checked?layer.addTo(map):map.removeLayer(layer));
toggle('cbR',rs);toggle('cbJ',jalan);toggle('cbB',batas);
$('bmBtn').onclick=()=>{$('bm').classList.toggle('open');$('bmBtn').classList.toggle('on');};
document.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{setBasemap(b.dataset.bm);$('bm').classList.remove('open');$('bmBtn').classList.remove('on');});
$('exportBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(R)],{type:'application/geo+json'}));
  a.download='rumah_sakit_kota_tangerang.geojson';a.click();URL.revokeObjectURL(a.href);
};
const home=L.featureGroup([batas,jalan,rs]).getBounds();
const goHome=()=>{if(home.isValid())map.fitBounds(home,{padding:[60,60],maxZoom:13});};
goHome();
$('homeBtn').onclick=goHome;
let me=null;
$('locateBtn').onclick=()=>{
  if(!navigator.geolocation){alert('Browser tidak mendukung lokasi.');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(me)map.removeLayer(me);
    me=L.circleMarker(ll,{radius:7,color:'#fff',weight:3,fillColor:'#1D5FA8',fillOpacity:1}).addTo(map).bindPopup('Lokasi saya').openPopup();
    map.setView(ll,15);
  },()=>alert('Lokasi tidak dapat diakses. Aktifkan izin lokasi pada browser.'),{enableHighAccuracy:true,timeout:10000});
};
$('fsBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
map.on('mousemove',e=>$('coordStatus').textContent=e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5));
map.on('mouseout',()=>$('coordStatus').textContent='Koordinat peta');
addEventListener('resize',()=>{map.invalidateSize();});
setTimeout(()=>{map.invalidateSize();goHome();},300);
</script>
</body>
